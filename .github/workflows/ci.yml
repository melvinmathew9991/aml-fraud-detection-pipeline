name: CI

# PR gate (lint-test, serving-isolation, container) on every pull request. On a
# push to main the same gate runs and is then followed by publish + deploy --
# ARCHITECTURE.md §8's "main:" pipeline stage.
#
# The GCP half is INERT UNTIL CONFIGURED. Every deploy-related step, and the
# deploy job itself, is gated on the `GCP_PROJECT_ID` repository variable being
# non-empty, so main stays green from now until Sprint 7's project actually
# exists. Setting the four variables below is what switches deployment on:
#
#   vars.GCP_PROJECT_ID    e.g. aml-fraud-detection-123456
#   vars.GCP_WIF_PROVIDER  projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   vars.GCP_DEPLOY_SA     deployer@<project>.iam.gserviceaccount.com
#
# Repository *variables*, not secrets: none of these are credentials. Keyless
# auth via Workload Identity Federation means there is no service-account JSON
# anywhere in this repo (ARCHITECTURE.md §8).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Deliberate, not a knob: us-central1 is a Tier 1 region, where the free tier
  # is applied as a spending-based discount. A Tier 2 region burns the same
  # allowance faster for identical work (GCP.md §8).
  GCP_REGION: us-central1
  AR_REPO: fraud-api
  SERVICE: fraud-api

jobs:
  lint-test:
    name: Lint, type-check, test, smoke-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Explicit, or setup-python's default `**/requirements.txt` glob keys
          # the cache off dashboard/requirements.txt alone -- the only file in
          # the repo matching that name, and the one this job cares least about.
          cache-dependency-path: |
            requirements-train.txt
            requirements-dev.txt
            dashboard/requirements.txt
      # dashboard/requirements.txt is needed for tests/test_dashboard_common.py:
      # it imports dashboard/common.py, which imports streamlit. Without it
      # pytest fails at *collection* and the whole suite is skipped.
      - run: pip install -r requirements-train.txt -r requirements-dev.txt -r dashboard/requirements.txt
      - name: ruff
        # tasks.py included: it lives at the repo root, so the three
        # directory paths alone would leave it unlinted.
        run: ruff check src/ dashboard/ tests/ tasks.py
      - name: mypy (src/inference -- scope set in pyproject.toml)
        run: mypy
      - name: pytest
        run: pytest -q
      - name: smoke-train
        # Synthetic sample only -- the real 493MB CSV is gitignored and CI
        # must never need it (ARCHITECTURE.md §8).
        run: |
          python src/generate_sample_data.py
          python src/train_pipeline.py

  serving-isolation:
    name: Serving dependency isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: install ONLY requirements-serve.txt
        # + pytest as a test runner, which is CI tooling, not a runtime
        # import risk -- the point of this job is that api/ and inference/
        # never import anything outside requirements-serve.txt.
        run: pip install -r requirements-serve.txt pytest==9.1.1
      - name: inference unit tests
        # Only the test files with no pandas/duckdb test-fixture dependency
        # (test_inference_state.py, the skew tests, and test_api.py's
        # TestClient all need pandas/duckdb/httpx2 -- train/test-only, see
        # requirements-train.txt -- and already run in lint-test above).
        run: pytest tests/test_inference_bundle.py tests/test_inference_features.py tests/test_inference_rules.py -v
      - name: boot a real uvicorn process and hit it over HTTP
        # Not TestClient -- a real process, real sockets, same as Sprint 4's
        # manual verification of this venv, now automated.
        run: |
          uvicorn api.main:app --app-dir src --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ready
          curl -sf -X POST http://localhost:8000/score -H "Content-Type: application/json" -d '{
            "step": 743, "type": "TRANSFER", "amount": 250000.0,
            "nameOrig": "C1231006815", "oldbalanceOrg": 250000.0, "newbalanceOrig": 0.0,
            "nameDest": "C1979787155", "oldbalanceDest": 0.0, "newbalanceDest": 250000.0
          }'

  container:
    name: Build image, integration test, trivy scan
    runs-on: ubuntu-latest
    needs: [lint-test, serving-isolation]
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation; no SA JSON in secrets
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t fraud-api:ci .

      - name: record image size (uncompressed and registry-storage estimate)
        # Two different numbers, for two different purposes.
        #
        # Uncompressed size is what `docker image inspect` reports and what
        # Sprint 6's <400MB target was written against. It governs disk and
        # pull-time on the runner.
        #
        # Artifact Registry, however, bills on COMPRESSED storage -- the sum of
        # the gzipped layer blobs. ROADMAP Sprint 7 originally sized its cleanup
        # policy at 3 versions against a 0.5GB free tier, written when the image
        # was believed to be ~185MB. It is 510.6MB. This step is what recomputed
        # the retention number against a measured compressed size rather than an
        # assumed one -- getting it wrong is the difference between a $0
        # deployment and a surprise bill -- and it keeps re-measuring so the
        # figure cannot go stale silently a second time.
        #
        # `docker save | gzip` is a close proxy for the registry's stored bytes,
        # not a byte-identical one: it wraps the layer blobs in a tar that also
        # carries manifests and metadata, and the registry gzips each layer
        # separately rather than the whole stream. Reported as an estimate for
        # that reason. It is accurate enough to choose a retention count.
        run: |
          SIZE_MB=$(docker image inspect fraud-api:ci --format='{{.Size}}' | awk '{printf "%.1f", $1/1024/1024}')
          echo "Image size: ${SIZE_MB} MB (uncompressed)"

          COMPRESSED_B=$(docker save fraud-api:ci | gzip -9 | wc -c)
          COMPRESSED_MB=$(awk -v b="$COMPRESSED_B" 'BEGIN{printf "%.1f", b/1048576}')
          RATIO=$(awk -v c="$COMPRESSED_MB" -v u="$SIZE_MB" 'BEGIN{printf "%.0f", 100*c/u}')

          # Google documents the free tier as "0.5 GB", which is ambiguous:
          # 0.5 GiB is 512 MiB, 0.5 GB decimal is ~476.8 MiB. The two give
          # different answers at this image size -- 3 stored versions fit under
          # the binary reading with 2.6 MiB to spare and breach the decimal one
          # by 34 MB. Assume the SMALLER bound: a retention policy that only
          # holds under the favourable interpretation of a billing unit is not
          # a policy, and the failure mode is a bill rather than a broken build.
          FREE_MB=476
          FITS=$(awk -v f="$FREE_MB" -v c="$COMPRESSED_MB" 'BEGIN{printf "%d", int(f/c)}')

          # Must match the cleanup policy in ROADMAP.md Sprint 7.
          PLANNED_VERSIONS=2

          echo "Compressed (registry storage estimate): ${COMPRESSED_MB} MB (${RATIO}% of uncompressed)"
          echo "Versions fitting in the free tier (conservative 0.5GB decimal): ${FITS}"
          echo "Cleanup policy retains: ${PLANNED_VERSIONS}"

          {
            echo "### Serving image"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Uncompressed | ${SIZE_MB} MB |"
            echo "| Compressed (registry estimate) | ${COMPRESSED_MB} MB |"
            echo "| Compression ratio | ${RATIO}% |"
            echo "| Versions within free tier (conservative) | **${FITS}** |"
            echo "| Cleanup policy retains | ${PLANNED_VERSIONS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FITS" -lt "$PLANNED_VERSIONS" ]; then
            echo "::warning::Image grew: only ${FITS} version(s) now fit in Artifact Registry's free tier, but the cleanup policy retains ${PLANNED_VERSIONS}. Lower the retention count in ROADMAP Sprint 7 and in the registry policy, or shrink the image."
          fi

      - name: run container under the Cloud Run memory ceiling, wait for /ready
        # --memory=512m mirrors the Cloud Run deploy flag (ARCHITECTURE.md §9),
        # so the ceiling the service will actually run under is enforced HERE,
        # where failing costs a red build, rather than first being discovered as
        # a 503 on a public URL. Measured locally, the bundle plus destination
        # state alone cost ~212MB RSS before FastAPI, uvicorn, LightGBM's
        # prediction buffers or a 10,000-row batch -- it fits, but not by so
        # much that it should go unverified.
        #
        # --memory-swap=512m pins total memory+swap to the same figure. Without
        # it Docker grants swap equal to the memory limit, and the container
        # would quietly swap instead of dying -- which is precisely the signal
        # this limit exists to produce. Cloud Run has no swap.
        #
        # The loop must record whether it actually saw a 200. Without the
        # READY flag it exits 0 on timeout, reporting the 30s ceiling as if
        # it were a cold-start measurement while the container is dead --
        # which is exactly what happened before this was fixed.
        run: |
          START=$(date +%s%N)
          docker run -d --name fraud-api-test             --memory=512m --memory-swap=512m             -p 8080:8080 fraud-api:ci
          READY=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ready >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          END=$(date +%s%N)
          if [ "$READY" -ne 1 ]; then
            # Distinguish an OOM kill from every other startup failure. Both
            # look identical from the outside -- /ready never answers -- but
            # they mean different things: one says the 512Mi budget is wrong,
            # the other says the code is. Docker records exit 137 / OOMKilled.
            OOM=$(docker inspect fraud-api-test --format='{{.State.OOMKilled}}' 2>/dev/null || echo "unknown")
            CODE=$(docker inspect fraud-api-test --format='{{.State.ExitCode}}' 2>/dev/null || echo "unknown")
            if [ "$OOM" = "true" ] || [ "$CODE" = "137" ]; then
              echo "::error::Container was OOM-killed under the 512m limit (OOMKilled=$OOM, exit=$CODE). The service will not fit Cloud Run's --memory=512Mi. Raise the limit in BOTH this job and the deploy job, or shrink the in-memory footprint -- do not deploy until they agree."
            else
              echo "::error::/ready never returned 200 within 30s -- container is not serving (OOMKilled=$OOM, exit=$CODE)"
            fi
            echo "--- docker ps -a ---"
            docker ps -a
            echo "--- docker logs fraud-api-test ---"
            docker logs fraud-api-test 2>&1 | tail -60
            exit 1
          fi
          COLD_START_MS=$(( (END - START) / 1000000 ))
          echo "Cold start (container run -> first 200 from /ready): ${COLD_START_MS} ms"
          echo "### Cold start: ${COLD_START_MS} ms" >> "$GITHUB_STEP_SUMMARY"

      - name: integration assertions -- /health, /ready, /score schema
        run: |
          curl -sf http://localhost:8080/health
          READY=$(curl -sf http://localhost:8080/ready)
          echo "$READY" | grep -q '"status":"ready"'
          RESP=$(curl -sf -w '\nLATENCY_S:%{time_total}' -X POST http://localhost:8080/score \
            -H "Content-Type: application/json" \
            -d '{
              "step": 743, "type": "TRANSFER", "amount": 250000.0,
              "nameOrig": "C1231006815", "oldbalanceOrg": 250000.0, "newbalanceOrig": 0.0,
              "nameDest": "C1979787155", "oldbalanceDest": 0.0, "newbalanceDest": 250000.0
            }')
          echo "$RESP"
          echo "$RESP" | head -n1 | grep -q '"decision"'

      - name: record memory headroom against the 512Mi ceiling
        # Turns "it fits" into a measured figure. Taken after /score has run,
        # so the model has actually predicted and LightGBM's buffers are
        # allocated -- a reading at /ready alone would flatter the result.
        #
        # Still a floor, not a worst case: this is a single-transaction score,
        # not the 10,000-row batch /score/batch permits. Reported as headroom
        # under load, not as a peak.
        run: |
          USAGE=$(docker stats fraud-api-test --no-stream --format '{{.MemUsage}}')
          PCT=$(docker stats fraud-api-test --no-stream --format '{{.MemPerc}}')
          echo "Memory after a scored request: ${USAGE} (${PCT} of the 512m limit)"
          {
            echo "### Memory under the Cloud Run ceiling"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Limit (matches deploy --memory) | 512 MiB |"
            echo "| In use after a scored request | ${USAGE} |"
            echo "| Percent of limit | ${PCT} |"
            echo ""
            echo "Single-transaction score, not a 10,000-row batch -- a floor, not a peak."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: stop container
        if: always()
        run: docker rm -f fraud-api-test || true

      - name: trivy scan
        # Tags are v-prefixed; a bare "0.28.0" does not resolve and fails the
        # job at setup, before docker build ever runs.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fraud-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # --- Sprint 7: publish -------------------------------------------------
      # The push lives in THIS job, not in `deploy`, so the image that reaches
      # Cloud Run is byte-identical to the one just integration-tested and
      # trivy-scanned above -- same daemon, same layer digests. Rebuilding in
      # `deploy` would ship a different (if near-identical) image than the one
      # that passed the gate, and "scanned" would stop meaning "deployed".
      #
      # Gated on main-pushes so PR builds never consume registry storage:
      # retention is 2 versions (GCP.md §6), and PR churn would evict the
      # currently-deployed image within a single afternoon.
      - name: authenticate to Google Cloud (keyless, WIF)
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: set up gcloud
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: push to Artifact Registry
        id: push
        if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
        run: |
          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          IMAGE="${REGISTRY}/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGISTRY" --quiet
          docker tag fraud-api:ci "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [container]
    # Inert until Sprint 7's project exists: with GCP_PROJECT_ID unset the job
    # is skipped, not failed, so main stays green in the meantime.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: authenticate to Google Cloud (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: deploy a revision WITHOUT traffic
        # The rollback design (ARCHITECTURE.md §8: "traffic stays on the
        # previous revision") is implemented by never giving the new revision
        # traffic until it has proved itself. There is nothing to undo on
        # failure -- the live revision was never touched.
        #
        # First deploy is the exception: a service's first revision always takes
        # 100% of traffic, --no-traffic notwithstanding, because there is no
        # other revision to serve. Handled explicitly rather than left to
        # surprise someone.
        run: |
          IMAGE="${{ needs.container.outputs.image }}"
          if [ -z "$IMAGE" ]; then
            echo "::error::container job produced no image reference"
            exit 1
          fi

          # --service-account pins the RUNTIME identity: what the container
          # runs as in production, not what deploys it. Without it Cloud Run
          # falls back to the Compute Engine default SA, which exists in this
          # project (enabling run.googleapis.com provisions it, with no need for
          # compute.googleapis.com) and is shared by every future service here.
          # This container calls no Google API at all, so its correct grant is
          # zero roles on an identity nothing else uses -- which is what
          # fraud-api-runtime is. See DEPLOY.md §4.0.
          COMMON="--image=$IMAGE --region=$GCP_REGION --platform=managed
            --service-account=fraud-api-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --min-instances=0 --max-instances=2
            --memory=512Mi --cpu=1 --concurrency=80 --timeout=30s"

          if gcloud run services describe "$SERVICE" --region="$GCP_REGION" >/dev/null 2>&1; then
            echo "FIRST_DEPLOY=0" >> "$GITHUB_ENV"
            gcloud run deploy "$SERVICE" $COMMON --no-traffic --tag=candidate
          else
            echo "FIRST_DEPLOY=1" >> "$GITHUB_ENV"
            echo "::notice::No existing service -- first deploy, so the new revision takes traffic immediately."
            gcloud run deploy "$SERVICE" $COMMON
          fi

          REV=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "Deployed revision: $REV"

      - name: verify the cost controls on the DEPLOYED revision
        # GCP.md §7: verify min-instances in the deployed revision, not in the
        # deploy command. A flag can be overridden by a service-level setting or
        # a console edit, and min-instances=1 is ~$61/month indefinitely -- the
        # single highest-consequence setting in the project.
        #
        # Checked BEFORE traffic migration: min-instances keeps instances warm
        # regardless of the traffic split, so a wrong value bills even at 0%.
        # An unset minScale annotation means 0, which is why empty passes.
        run: |
          MIN=$(gcloud run revisions describe "$REV" --region="$GCP_REGION" \
            --format='value(metadata.annotations."autoscaling.knative.dev/minScale")')
          MAX=$(gcloud run revisions describe "$REV" --region="$GCP_REGION" \
            --format='value(metadata.annotations."autoscaling.knative.dev/maxScale")')

          echo "minScale='${MIN:-(unset, means 0)}'  maxScale='${MAX}'"

          if [ -n "$MIN" ] && [ "$MIN" != "0" ]; then
            echo "::error::min-instances is '$MIN' on revision $REV, not 0. That bills ~61 USD/month indefinitely (GCP.md §5②). Refusing to send traffic."
            exit 1
          fi
          if [ "$MAX" != "2" ]; then
            echo "::error::max-instances is '$MAX' on revision $REV, not 2 -- the hard ceiling on concurrent billing (ARCHITECTURE.md §9)."
            exit 1
          fi

      - name: smoke test the new revision before it serves anyone
        # Hits the candidate's own tagged URL, which addresses this revision
        # specifically while live traffic continues to go to the old one.
        run: |
          if [ "$FIRST_DEPLOY" = "1" ]; then
            URL=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" \
              --format='value(status.url)')
          else
            URL=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" --format=json \
              | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          fi
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::could not resolve a URL for the candidate revision"
            exit 1
          fi
          echo "Smoke-testing $URL"

          # The expected bundle version comes from the committed bundle rather
          # than a literal, so the check cannot drift from the artifact.
          EXPECTED=$(jq -r .bundle_version model_bundle/v1/bundle_meta.json)

          READY=""
          for i in $(seq 1 60); do
            READY=$(curl -sf --max-time 10 "$URL/ready" || true)
            [ -n "$READY" ] && break
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo "::error::/ready never returned 200 within ~120s"
            gcloud run services logs read "$SERVICE" --region="$GCP_REGION" --limit=60 || true
            exit 1
          fi
          echo "$READY"

          echo "$READY" | jq -e --arg v "$EXPECTED" '.status == "ready" and .bundle_version == $v' >/dev/null \
            || { echo "::error::/ready did not report status=ready with bundle_version=$EXPECTED"; exit 1; }

          RESP=$(curl -sf --max-time 30 -X POST "$URL/score" \
            -H "Content-Type: application/json" \
            -d '{
              "step": 743, "type": "TRANSFER", "amount": 250000.0,
              "nameOrig": "C1231006815", "oldbalanceOrg": 250000.0, "newbalanceOrig": 0.0,
              "nameDest": "C1979787155", "oldbalanceDest": 0.0, "newbalanceDest": 250000.0
            }')
          echo "$RESP"
          echo "$RESP" | jq -e '.decision' >/dev/null \
            || { echo "::error::/score did not return a decision"; exit 1; }

      - name: migrate traffic to the verified revision
        if: env.FIRST_DEPLOY == '0'
        run: |
          gcloud run services update-traffic "$SERVICE" --region="$GCP_REGION" \
            --to-revisions="$REV=100" --remove-tags=candidate
          SERVED=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)')
          echo "Now serving: $SERVED"

      - name: report the deployed URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" \
            --format='value(status.url)')
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $URL |"
            echo "| Revision | $REV |"
            echo "| Image | \`${{ needs.container.outputs.image }}\` |"
            echo "| min-instances | 0 (verified on the revision) |"
            echo "| max-instances | 2 (verified on the revision) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: discard the unverified revision
        # Only reached when a step above failed. On the normal path the failed
        # revision holds no traffic, so deleting it is the whole rollback -- the
        # previous revision never stopped serving. On a FIRST deploy the
        # revision does hold traffic and cannot be deleted; there is also
        # nothing to roll back to, so the `|| true` is the honest outcome.
        if: failure() && env.REV != ''
        run: |
          echo "::warning::Deploy failed -- discarding revision $REV. Live traffic was not moved."
          gcloud run revisions delete "$REV" --region="$GCP_REGION" --quiet || true
