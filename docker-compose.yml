# CI-verified, not locally verified (ROADMAP Sprint 6, GIT_WORKFLOW.md):
# this dev machine has no Docker, so this file is exercised by the CI
# container-integration job, never by a local `docker compose up` here.
# Committed for anyone cloning with Docker available.
services:
  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
